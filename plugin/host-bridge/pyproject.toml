[project]
name = "flipper-agent-buddy-claude-bridge"
version = "0.6.0"
description = "Claude Code adapter bridge for Flipper Agent Buddy"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "bleak>=0.21",
]

[project.scripts]
flipper-agent-bridge = "bridge.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
